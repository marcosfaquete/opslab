server {

    server_name marcosfaquete.com.br www.marcosfaquete.com.br;

    root /var/www/marcos-lab/html;
    index index.html;


    # =========================================================
    # ANALYTICS PRIVADO
    # =========================================================

    # Painel visual privado
    location ^~ /opslab/analytics/ {
        auth_basic "Marcos Lab Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd-analytics;

        alias /var/www/opslab/html/analytics/;
        index index.html;
    }

    # API privada usada pelo painel
    location = /api/analytics/summary {
        auth_basic "Marcos Lab Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd-analytics;

        proxy_pass http://127.0.0.1:3000/analytics/summary;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }



    # Histórico detalhado privado do Analytics
    location = /api/analytics/pageviews {
        auth_basic "Marcos Lab Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd-analytics;

        proxy_pass http://127.0.0.1:3000/analytics/pageviews;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # OpsLab frontend
    location = /opslab {
        return 301 /opslab/;
    }

    location /opslab/ {
        alias /var/www/opslab/html/;
        index index.html;
    }

    # OpsLab API
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        # Preserva o IP real do visitante para o Node.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marcos Lab
    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/marcosfaquete.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/marcosfaquete.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.marcosfaquete.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = marcosfaquete.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;

    server_name marcosfaquete.com.br www.marcosfaquete.com.br;
    return 404; # managed by Certbot
}
